version: "3.9"

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - .env

  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    env_file:
      - .env

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15
    container_name: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    env_file:
      - .env

  upload-service:
    build:
      context: ./services/upload_service
      dockerfile: Dockerfile
    container_name: upload-service
    ports:
      - "8000:8000"
    depends_on:
      - rabbitmq
      - minio
    env_file:
      - .env

  audio-service:
    build:
      context: ./services/audio_service
      dockerfile: Dockerfile
    container_name: audio-service
    depends_on:
      - rabbitmq
      - minio
    env_file:
      - .env

  transcription-service:
    build:
      context: ./services/transcription_service
      dockerfile: Dockerfile
    container_name: transcription-service
    depends_on:
      - rabbitmq
      - minio
    env_file:
      - .env
  
  analysis-service:
    build:
      context: ./services/analysis_service
      dockerfile: Dockerfile
    container_name: analysis-service
    depends_on:
      - rabbitmq
      - postgres
      - redis
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    labels:
      com.datadoghq.ad.logs: '[{"source": "python", "service": "analysis-service"}]'

  query-service:
    build:
      context: ./services/query_service
      dockerfile: Dockerfile
    container_name: query-service
    ports:
      - "8001:8001"  # Port 8001 exposed to host
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres

  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    container_name: datadog-agent
    environment:
      - DD_API_KEY=${DD_API_KEY}
      - DD_SITE=${DD_SITE}
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
      - DD_PROCESS_AGENT_ENABLED=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    env_file:
      - .env

volumes:
  minio-data:
  postgres-data: