version: "3.9"

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - .env

  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    env_file:
      - .env

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15
    container_name: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    env_file:
      - .env

  upload-service:
    build:
      context: ./services/upload_service
      dockerfile: Dockerfile
    container_name: upload-service
    ports:
      - "8000:8000"
    depends_on:
      - rabbitmq
      - minio
    env_file:
      - .env

  audio-service:
    build:
      context: ./services/audio_service
      dockerfile: Dockerfile
    container_name: audio-service
    depends_on:
      - rabbitmq
      - minio
    env_file:
      - .env

  transcription-service:
    build:
      context: ./services/transcription_service
      dockerfile: Dockerfile
    container_name: transcription-service
    depends_on:
      - rabbitmq
      - minio
    env_file:
      - .env
  
  analysis-service:
    build:
      context: ./services/analysis_service
      dockerfile: Dockerfile
    container_name: analysis-service
    depends_on:
      - rabbitmq
      - postgres
      - redis
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis

volumes:
  minio-data:
  postgres-data: